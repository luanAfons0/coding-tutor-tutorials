<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Study Tutorials</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css"
  />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>

  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --link: #58a6ff;
      --accent: #d29922;
      --code-bg: #1c2128;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }
    aside.sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      overflow-y: auto;
      position: sticky;
      top: 0;
      max-height: 100vh;
    }
    .sidebar h1 {
      font-size: 0.85rem;
      margin: 0 0 16px 0;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .nav-section { margin-bottom: 4px; }
    .nav-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 12px;
      margin-top: 10px;
      font-family: inherit;
      text-align: left;
      border-radius: 6px;
    }
    .nav-section-header:hover { background: rgba(255, 255, 255, 0.04); }
    .nav-section-header .chev {
      color: var(--muted);
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    .nav-section.collapsed .chev { transform: rotate(-90deg); }
    .nav-section.collapsed .nav-section-body { display: none; }
    .nav-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0 4px 0;
    }
    .nav-about { color: var(--muted); font-size: 0.9rem; }
    .nav-item {
      display: block;
      padding: 10px 12px;
      margin: 6px 0;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.1s, color 0.1s;
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.05); }
    .nav-item.active {
      background: rgba(88, 166, 255, 0.15);
      color: var(--link);
    }
    .nav-item .date {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    main {
      padding: 48px 64px;
      width: 100%;
      overflow-x: hidden;
    }
    main h1 {
      font-size: 2.2rem;
      margin-top: 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    main h2 {
      font-size: 1.55rem;
      margin-top: 2.6rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    main h3 { font-size: 1.25rem; margin-top: 2rem; }
    main h4 { font-size: 1.05rem; margin-top: 1.6rem; }
    main a { color: var(--link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main p, main li { font-size: 1rem; }
    main blockquote {
      border-left: 4px solid var(--accent);
      padding: 8px 16px;
      margin: 16px 0;
      background: rgba(210, 153, 34, 0.08);
      color: var(--text);
    }
    main code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
    }
    main pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.5;
    }
    main pre code {
      background: none;
      padding: 0;
      font-size: 0.88rem;
    }
    main table {
      border-collapse: collapse;
      margin: 16px 0;
      width: 100%;
    }
    main th, main td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    main th { background: var(--panel); }
    main hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    .meta {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 32px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta strong { color: var(--text); }
    .placeholder {
      color: var(--muted);
      font-size: 1.2rem;
      text-align: center;
      margin-top: 80px;
    }
    .repo-link {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .repo-link:hover { color: var(--link); }
    .repo-link svg { flex-shrink: 0; }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      aside.sidebar { position: static; max-height: none; }
      main { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>📚 Tutorials</h1>
      <nav id="nav"></nav>
      <a
        class="repo-link"
        href="https://github.com/luanAfons0/coding-tutor-tutorials"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
        View on GitHub
      </a>
    </aside>
    <main id="content">
      <p class="placeholder">Pick a tutorial from the sidebar.</p>
    </main>
  </div>

  <script>
    const navEl = document.getElementById("nav");
    const contentEl = document.getElementById("content");
    let manifestData = null;

    marked.setOptions({
      gfm: true,
      breaks: false,
      highlight(code, lang) {
        try {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        } catch (e) {
          return code;
        }
      },
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadList() {
      const res = await fetch("./manifest.json", { cache: "no-store" });
      if (!res.ok) {
        navEl.innerHTML =
          '<p style="color: var(--muted); font-size: 0.85rem;">Could not load manifest.json. Run <code>python3 server.py --build</code> to generate it.</p>';
        return;
      }
      manifestData = await res.json();
      const sections = manifestData.sections || [];
      navEl.innerHTML = "";

      // Standalone guide pages (Who am I, The Project, Contributing) come first,
      // above the course accordions, as the site's orientation.
      const pages = manifestData.pages || [];
      if (pages.length) {
        for (const page of pages) {
          const link = makeNavItem(page);
          link.classList.add("nav-about");
          navEl.appendChild(link);
        }
        navEl.appendChild(document.createElement("hr")).className = "nav-divider";
      }

      for (const section of sections) {
        const wrap = document.createElement("div");
        wrap.className = "nav-section";
        wrap.dataset.sectionId = section.id || "";

        const header = document.createElement("button");
        header.className = "nav-section-header";
        header.innerHTML =
          `<span>${escapeHtml(section.title)}</span><span class="chev">▾</span>`;
        header.addEventListener("click", () => toggleSection(wrap));
        wrap.appendChild(header);

        const body = document.createElement("div");
        body.className = "nav-section-body";
        for (const item of section.items || []) {
          body.appendChild(makeNavItem(item));
        }
        wrap.appendChild(body);
        navEl.appendChild(wrap);
      }

      // Default: collapse all, open the first real course (not Extras).
      const allSections = [...navEl.querySelectorAll(".nav-section")];
      allSections.forEach((s) => s.classList.add("collapsed"));
      const def =
        allSections.find((s) => s.dataset.sectionId !== "extras") || allSections[0];
      if (def) def.classList.remove("collapsed");
    }

    function makeNavItem(item) {
      const key = item.path || item.filename;
      const a = document.createElement("a");
      a.className = "nav-item";
      a.href = "#" + key;
      a.dataset.filename = key;
      a.innerHTML =
        escapeHtml(item.title) +
        (item.date ? `<span class="date">${escapeHtml(item.date)}</span>` : "");
      return a;
    }

    // Accordion: opening a section collapses the others.
    function toggleSection(wrap) {
      const wasCollapsed = wrap.classList.contains("collapsed");
      navEl
        .querySelectorAll(".nav-section")
        .forEach((s) => s.classList.add("collapsed"));
      if (wasCollapsed) wrap.classList.remove("collapsed");
    }

    function updateActive(filename) {
      let activeSection = null;
      for (const link of navEl.querySelectorAll(".nav-item")) {
        const isActive = link.dataset.filename === filename;
        link.classList.toggle("active", isActive);
        if (isActive) activeSection = link.closest(".nav-section");
      }
      if (activeSection) {
        navEl
          .querySelectorAll(".nav-section")
          .forEach((s) => s.classList.add("collapsed"));
        activeSection.classList.remove("collapsed");
      }
    }

    function parseFrontmatter(md) {
      const m = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (!m) return { fm: {}, body: md };
      const fm = {};
      for (const line of m[1].split("\n")) {
        const i = line.indexOf(":");
        if (i === -1) continue;
        const k = line.slice(0, i).trim();
        let v = line.slice(i + 1).trim();
        if (v.startsWith("[") && v.endsWith("]")) {
          v = v
            .slice(1, -1)
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean);
        }
        fm[k] = v;
      }
      return { fm, body: m[2] };
    }

    function renderMeta(fm) {
      if (!fm || Object.keys(fm).length === 0) return "";
      const bits = [];
      if (fm.created) bits.push(`<strong>Created:</strong> ${escapeHtml(fm.created)}`);
      if (fm.concepts) {
        const concepts = Array.isArray(fm.concepts)
          ? fm.concepts.join(", ")
          : fm.concepts;
        bits.push(`<strong>Concepts:</strong> ${escapeHtml(concepts)}`);
      }
      if (fm.understanding_score && fm.understanding_score !== "null") {
        bits.push(`<strong>Score:</strong> ${escapeHtml(fm.understanding_score)}/10`);
      }
      if (fm.last_quizzed && fm.last_quizzed !== "null") {
        bits.push(`<strong>Last quizzed:</strong> ${escapeHtml(fm.last_quizzed)}`);
      }
      return bits.length ? `<div class="meta">${bits.join(" · ")}</div>` : "";
    }

    async function loadTutorial(filename) {
      if (!filename) {
        contentEl.innerHTML =
          '<p class="placeholder">Pick a tutorial from the sidebar.</p>';
        return;
      }
      const url = "./" + filename.split("/").map(encodeURIComponent).join("/");
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) {
        contentEl.innerHTML = `<p class="placeholder">Could not load ${escapeHtml(filename)}</p>`;
        return;
      }
      const md = await res.text();
      const { fm, body } = parseFrontmatter(md);
      const html = renderMeta(fm) + marked.parse(body);
      contentEl.innerHTML = html;
      window.scrollTo(0, 0);
      updateActive(filename);
    }

    function currentFile() {
      return decodeURIComponent(location.hash.slice(1));
    }

    window.addEventListener("hashchange", () => loadTutorial(currentFile()));

    (async () => {
      await loadList();
      const f = currentFile();
      if (f) {
        loadTutorial(f);
      } else if (manifestData && manifestData.pages && manifestData.pages.length) {
        // Land on the first guide page (Who am I) instead of an empty pane.
        loadTutorial(manifestData.pages[0].path);
      }
    })();
  </script>
</body>
</html>
